<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kolam Recall and Trace</title>
<link rel="stylesheet" href="../../core/theme.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{max-width:60rem;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;gap:.2rem;padding:0 1rem .4rem;align-items:center}
#st{font-size:.9rem;opacity:.85;margin-left:.4rem}
canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none}
body.vr{background:#000}body.vr .top,body.vr #bar{display:none}
</style>
<header class="top"><h1>🌼 Kolam Recall and Trace</h1><a href="../hub/">All games</a><a href="../mindhaven/">Memory Isles</a><a href="../hub/#report">Session report</a></header>
<div id="bar">
 <button class="btn pri" id="cam">Start camera</button><button class="btn" id="mouse">Mouse mode</button><button class="btn" id="flip">Flip camera</button>
 <button class="btn" id="mir">Mirror</button><button class="btn" id="vr">VR mode</button><button class="btn" id="exp">Export</button><button class="btn" id="clr">Clear data</button>
 <span id="st">Choose camera or mouse to begin.</span>
</div>
<canvas id="view"></canvas>
<script type="module" src="kolam.js"></script>
